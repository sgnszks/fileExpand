<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件体积膨胀工具</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>文件体积膨胀工具</h1>
            <p class="subtitle">在不改变文件可见内容的前提下，安全地增大文件体积</p>
        </header>

        <main class="main">
            <!-- 文件上传区域 -->
            <section class="upload-section" id="uploadSection">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                    </div>
                    <p class="upload-text">点击选择文件或拖拽至此处</p>
                    <p class="upload-hint">支持格式：.xlsx / .docx / .pptx / .pdf / .doc / .ppt</p>
                    <p class="upload-hint">最大文件大小：100MB</p>
                    <input type="file" id="fileInput" class="file-input"
                           accept=".xlsx,.docx,.pptx,.pdf,.doc,.ppt"
                           aria-label="选择要上传的文件">
                </div>

                <!-- 已选文件信息 -->
                <div class="file-info" id="fileInfo" style="display: none;">
                    <div class="file-info-content">
                        <span class="file-name" id="fileName"></span>
                        <span class="file-size" id="fileSize"></span>
                    </div>
                    <button type="button" class="btn-remove" id="removeFile" aria-label="移除已选文件">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>
            </section>

            <!-- 倍数输入区域 -->
            <section class="multiplier-section">
                <label for="multiplierInput" class="field-label">目标膨胀倍数</label>
                <div class="multiplier-controls">
                    <div class="preset-buttons" role="group" aria-label="预设倍数选择">
                        <button type="button" class="btn-preset" data-value="1.5">1.5x</button>
                        <button type="button" class="btn-preset" data-value="2">2x</button>
                        <button type="button" class="btn-preset" data-value="3">3x</button>
                        <button type="button" class="btn-preset" data-value="5">5x</button>
                    </div>
                    <div class="custom-input-group">
                        <input type="number" id="multiplierInput"
                               class="multiplier-input"
                               min="1.1" max="10" step="0.1"
                               placeholder="自定义倍数"
                               aria-describedby="multiplierHint">
                        <span class="input-suffix">倍</span>
                    </div>
                    <p class="input-hint" id="multiplierHint">允许范围：1.1 ~ 10 倍</p>
                </div>
            </section>

            <!-- 操作按钮 -->
            <section class="action-section">
                <button type="button" class="btn-primary" id="processBtn" disabled>
                    <span class="btn-text">开始处理</span>
                    <span class="btn-loading" style="display: none;">
                        <span class="spinner"></span>
                        处理中...
                    </span>
                </button>
            </section>

            <!-- 状态展示区域 -->
            <section class="status-section" id="statusSection" style="display: none;">
                <div class="status-bar">
                    <div class="status-steps">
                        <div class="status-step" data-step="upload">
                            <span class="step-indicator"></span>
                            <span class="step-label">已上传</span>
                        </div>
                        <div class="status-step" data-step="validate">
                            <span class="step-indicator"></span>
                            <span class="step-label">校验中</span>
                        </div>
                        <div class="status-step" data-step="process">
                            <span class="step-indicator"></span>
                            <span class="step-label">处理中</span>
                        </div>
                        <div class="status-step" data-step="verify">
                            <span class="step-indicator"></span>
                            <span class="step-label">验证中</span>
                        </div>
                        <div class="status-step" data-step="done">
                            <span class="step-indicator"></span>
                            <span class="step-label">已完成</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 结果展示区域 -->
            <section class="result-section" id="resultSection" style="display: none;">
                <h2 class="section-title">处理结果</h2>
                <div class="result-grid">
                    <div class="result-item">
                        <span class="result-label">原始大小</span>
                        <span class="result-value" id="resultOriginalSize">-</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">输出大小</span>
                        <span class="result-value" id="resultOutputSize">-</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">目标倍数</span>
                        <span class="result-value" id="resultTargetMultiplier">-</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">实际倍数</span>
                        <span class="result-value" id="resultActualMultiplier">-</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">使用策略</span>
                        <span class="result-value result-strategy" id="resultStrategy">-</span>
                    </div>
                </div>

                <!-- 警告信息 -->
                <div class="warnings" id="warningsArea" style="display: none;">
                    <ul id="warningsList"></ul>
                </div>

                <!-- 下载按钮 -->
                <div class="download-area">
                    <a class="btn-download" id="downloadBtn" href="#" download>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        下载膨胀后的文件
                    </a>
                </div>
            </section>

            <!-- 错误提示区域 -->
            <section class="error-section" id="errorSection" style="display: none;">
                <div class="error-content">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="15" y1="9" x2="9" y2="15"/>
                        <line x1="9" y1="9" x2="15" y2="15"/>
                    </svg>
                    <span id="errorMessage"></span>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p>文件体积膨胀工具 — 标准兼容的文件处理与体积调节</p>
        </footer>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
